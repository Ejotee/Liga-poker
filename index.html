<style>
:root{
  --bg:#0B0B0C; --surface:#141416; --sunk:#1B1B1E; --ink:#ECEDEF; --muted:#9C9EA5; --line:rgba(214,216,222,.16); --line2:rgba(214,216,222,.32);

  --ok:#8CCFAA; --warn:#E0666A;

  background:radial-gradient(1200px 600px at 50% -10%,rgba(255,255,255,.06),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid #E6E7EA;outline-offset:2px}
::selection{background:#D8D9DD;color:#000}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(7,7,8,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--felt-ink);
  border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,rgba(220,222,228,.45),transparent) 1}
.brand{max-width:1080px;margin:0 auto;padding:14px 20px 6px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brandmark{display:flex;align-items:center;gap:12px;min-width:0}
.brandmark .emblem{width:54px;height:auto;flex:none;filter:drop-shadow(0 0 10px rgba(255,255,255,.08))}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(1.15rem,3.6vw,1.75rem);line-height:1.05;letter-spacing:.08em;
  background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.season-pick{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.season-pick select{background:#111113;border:1px solid var(--line2);color:var(--ink);border-radius:4px;padding:6px 10px;font-family:var(--body);font-size:.9rem;letter-spacing:0;text-transform:none}
.hbtn{background:none;border:1px solid var(--line2);color:var(--ink);border-radius:4px;padding:6px 12px;cursor:pointer;font-family:var(--display);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase}
.hbtn:hover{border-color:#E6E7EA}
.tabs{max-width:1080px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:var(--muted);padding:10px 12px 12px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;border-bottom:1px solid transparent}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:#E6E7EA}

main{max-width:1080px;margin:0 auto;padding:26px 20px 40px}
.notice{max-width:1080px;margin:12px auto 0;padding:10px 20px;color:var(--muted);font-size:.88rem}

h2{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:.05em;margin:0 0 4px;line-height:1.15;
  background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
h3{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:#C9CBD0;margin:28px 0 12px}
h3::before{content:"\2660";font-size:.8rem;color:var(--silver);letter-spacing:0}
h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.sub{color:var(--muted);margin:0 0 18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:18px}

.btn{border:1px solid var(--line2);background:transparent;border-radius:4px;padding:9px 16px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);transition:border-color .15s,background .15s}
.btn:hover{border-color:#E6E7EA;background:rgba(255,255,255,.04)}
.btn.primary{background:var(--metal-flat);border-color:#E6E7EA;color:#0B0B0C;font-weight:700}
.btn.primary:hover{background:linear-gradient(180deg,#FFFFFF,#D3D5DA)}
.btn.ghost{background:none;border-color:transparent;color:#D4D6DB;padding:6px 8px;text-decoration:underline;text-underline-offset:3px}
.btn.danger{color:var(--warn);border-color:rgba(224,102,106,.4)}
.btn.sm{padding:5px 10px;font-size:.7rem}
.btn:disabled{opacity:.5;cursor:default}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;position:relative}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* Tables */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--display);font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
td.n,th.n{text-align:right}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(255,255,255,.035)}
.pts{font-family:var(--display);font-weight:700;font-size:1.15rem;color:#fff}
.pos{color:var(--ok)} .neg{color:var(--warn)}
.name-btn{background:none;border:0;padding:0;font-weight:700;cursor:pointer;text-align:left;color:var(--ink)}
.name-btn:hover{text-decoration:underline;text-underline-offset:3px}

/* Poker chips in the OG silver/black style */
.chip{--c:#26272B;--s:#CFD1D6;--t:#F2F2F4;position:relative;width:2.3rem;height:2.3rem;border-radius:50%;flex:none;
  display:grid;place-items:center;color:var(--t);font-family:var(--display);font-weight:700;font-size:.9rem;
  background:radial-gradient(circle,var(--c) 0 50%,var(--s) 51% 54%,var(--c) 55% 66%,transparent 67%),
             repeating-conic-gradient(var(--c) 0 22.5deg,var(--s) 22.5deg 37.5deg,var(--c) 37.5deg 45deg);
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.5)}
.chip.p1{--c:#C9A03C;--s:#FFF0BF;--t:#1A1204;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 14px rgba(214,170,70,.35)}
.chip.p2{--c:#B4B8BF;--s:#FFFFFF;--t:#0B0B0C}
.chip.p3{--c:#A8613A;--s:#F3CDB2;--t:#1A0B03}
.chip.plain{background:none;color:var(--muted);box-shadow:none;font-weight:600}

.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 26px;align-items:end}
.pod{position:relative;background:linear-gradient(180deg,#18181B,#111113);border:1px solid var(--line2);border-radius:4px;padding:18px 12px;text-align:center;min-width:0}
.pod::before{content:"";position:absolute;inset:5px;border:1px solid var(--line);border-radius:2px;pointer-events:none}
.pod .chip{margin:0 auto 12px;width:3rem;height:3rem;font-size:1.1rem}
.pod.first{padding-top:26px;padding-bottom:26px;box-shadow:0 0 40px rgba(255,255,255,.06)}
.pod.first .chip{width:4.2rem;height:4.2rem;font-size:1.5rem}
.pod .who{font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;line-height:1.2;overflow-wrap:anywhere}
.pod .who .av{width:2.2rem;height:2.2rem}
.pod .big{font-family:var(--display);font-weight:700;font-size:2.1rem;line-height:1.1;margin-top:4px;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.pod.first .big{font-size:2.9rem}
.pod.place1{border-color:rgba(214,170,70,.55)} .pod.place1::before{border-color:rgba(214,170,70,.25)}
.pod.place1 .big{background:linear-gradient(180deg,#FFF3C8,#E2BE5E 45%,#9C7424 60%,#F1D78A);-webkit-background-clip:text;background-clip:text}
.pod.place2 .big{background:linear-gradient(180deg,#FFFFFF,#D8DADE 40%,#8E9299 60%,#E9EAEC);-webkit-background-clip:text;background-clip:text}
.pod.place3{border-color:rgba(176,104,62,.5)} .pod.place3::before{border-color:rgba(176,104,62,.22)}
.pod.place3 .big{background:linear-gradient(180deg,#FBD9C2,#C98256 45%,#7E4222 60%,#E3A57E);-webkit-background-clip:text;background-clip:text}
.pod small{color:var(--muted);font-family:var(--display);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase}
.av{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--avc);color:#fff;font-size:1rem;font-weight:700;flex:none;vertical-align:middle;line-height:1;box-shadow:0 0 0 1px rgba(220,222,228,.35)}
.av.lg{width:4.5rem;height:4.5rem;font-size:2.3rem}
.av.md{width:2.6rem;height:2.6rem;font-size:1.35rem}
.who-cell{display:inline-flex;align-items:center;gap:8px}
.live{position:relative;background:linear-gradient(180deg,#1A1012,#120C0D);border:1px solid rgba(192,57,62,.55);color:#fff;border-radius:4px;padding:14px 16px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.live b{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.live .btn{background:var(--metal-flat);color:#0B0B0C;border-color:#E6E7EA}
.dot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--red);margin-right:10px;box-shadow:0 0 10px var(--red);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.victims{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.victim{display:grid;justify-items:center;gap:8px;padding:16px 8px;border:1px solid var(--line2);border-radius:4px;background:var(--surface);cursor:pointer;font-weight:700;text-align:center;color:var(--ink)}
.victim:hover{border-color:#E6E7EA;background:#1A1A1D}
.victim:active{transform:scale(.97)}
.swatches,.emojis{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:2.2rem;height:2.2rem;border-radius:50%;border:2px solid transparent;cursor:pointer;background:var(--c);box-shadow:0 0 0 1px var(--line2)}
.sw[aria-pressed="true"]{border-color:#fff}
.em{width:2.6rem;height:2.6rem;border-radius:4px;border:1px solid var(--line2);background:var(--surface);font-size:1.35rem;cursor:pointer}
.em[aria-pressed="true"]{border-color:#fff;background:#222226}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av.xl{width:7rem;height:7rem;font-size:3.4rem;box-shadow:0 0 0 2px rgba(230,231,234,.7),0 10px 30px rgba(0,0,0,.6)}
.pcard{position:relative;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:var(--pbg,#141416);padding:22px 20px 20px}
.pcard::before{content:"";position:absolute;inset:6px;border:1px solid rgba(255,255,255,.12);border-radius:3px;pointer-events:none}
.pcard::after{content:"\2660";position:absolute;right:18px;top:6px;font-size:6rem;line-height:1;color:rgba(255,255,255,.05);pointer-events:none}
.pc-top{position:relative;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pc-name{font-family:var(--display);font-weight:700;font-size:1.7rem;letter-spacing:.05em;line-height:1.1;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
.pc-real{color:#C9CBD0;font-size:.92rem;margin-top:2px}
.pc-hand{display:inline-block;margin-top:8px;font-family:var(--display);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:#E6E7EA;border:1px solid rgba(255,255,255,.3);padding:3px 10px;border-radius:2px;background:rgba(0,0,0,.25)}
.pc-quote{position:relative;margin:18px 0 0;padding:12px 16px;border-left:2px solid rgba(255,255,255,.55);background:rgba(0,0,0,.28);font-family:var(--display);font-size:1.02rem;letter-spacing:.04em;color:#F2F2F4}
.pc-bio{position:relative;margin:12px 0 0;color:#D4D6DB;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.duo .rv{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer;color:var(--ink);text-align:left;width:100%}
.duo .rv:hover{border-color:var(--line2)}
.duo .rv.nem{border-left:2px solid var(--warn)} .duo .rv.vic{border-left:2px solid var(--ok)}
.duo .rv small{display:block;font-family:var(--display);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.duo .rv b{display:block;font-weight:700;font-size:1.02rem}
.duo .rv span.c{font-size:.84rem;color:var(--muted)}
@media (max-width:560px){.duo{grid-template-columns:1fr}}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 10px 6px}
.chart svg{display:block;width:100%;height:auto}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 6px 6px}
.chart-head b{font-family:var(--display);font-size:1.3rem}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);padding:2px 6px 6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:middle;border-radius:2px}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.th{width:4.6rem;height:2.8rem;border-radius:4px;border:1px solid var(--line2);cursor:pointer;background:var(--c);color:#fff;font-size:.6rem;font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;display:grid;place-items:end center;padding-bottom:4px}
.th[aria-pressed="true"]{outline:2px solid #fff;outline-offset:2px}
textarea.in{border:1px solid var(--line2);background:#0E0E10;border-radius:4px;padding:9px 10px;width:100%;color:var(--ink);font-family:var(--body);font-size:1rem;letter-spacing:0;text-transform:none;resize:vertical;min-height:90px}
textarea.in:focus{border-color:#E6E7EA;outline:none}
.photo-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.filebtn{position:relative;overflow:hidden;display:inline-block}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.phero{display:flex;gap:16px;align-items:center;margin-bottom:8px}
.phero .motto{color:var(--muted);font-style:italic}
.krow{display:grid;grid-template-columns:minmax(110px,180px) 1fr 2.5rem 6.5rem;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.krow:last-child{border-bottom:0}
.krow b{text-align:right;font-family:var(--display);font-weight:700;font-size:1.1rem}
.krow small{color:var(--muted)}
.kolist{display:grid;gap:6px}
.ko{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
.ko .x{margin-left:auto;font-size:1.2rem}
.rrow{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow .r{text-align:right}
.score{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.score b{font-family:var(--display);font-weight:700;font-size:1.35rem;color:#fff;min-width:1.4rem;text-align:center}
.kbar{height:6px;background:#222226;border-radius:99px;overflow:hidden}
.kbar span{display:block;height:100%;background:var(--metal-flat);border-radius:99px}
@media (max-width:560px){.krow{grid-template-columns:1fr 2.5rem}.krow .kbar,.krow small{display:none}}
@media (max-width:560px){ .podium{gap:8px} .pod{padding:14px 6px} .pod .big{font-size:1.55rem} .pod.first .big{font-size:2.1rem} }

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.2;font-variant-numeric:tabular-nums;color:#fff}
.stat span{color:var(--muted);font-size:.82rem}

/* Lists */
.list{display:grid;gap:8px}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.item:hover{border-color:var(--line2);background:#18181B}
.item .meta{color:var(--muted);font-size:.86rem}
.item .r{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-family:var(--display);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border-radius:2px;border:1px solid var(--line2);color:var(--muted);font-weight:600;vertical-align:middle}
.tag.on{border-color:#E6E7EA;color:#fff}
.tag.due{border-color:rgba(224,102,106,.6);color:var(--warn)}
.tag.wait{border-color:rgba(230,231,234,.5);color:#E6E7EA;border-style:dashed}

/* Forms */
label.f{display:grid;gap:5px;font-family:var(--display);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=password],select.in{border:1px solid var(--line2);background:#0E0E10;border-radius:4px;padding:9px 10px;min-width:0;width:100%;color:var(--ink);font-family:var(--body);font-size:1rem;letter-spacing:0;text-transform:none}
input:focus,select:focus{border-color:#E6E7EA;outline:none}
input[type=date]{color-scheme:dark}
input[type=file]{color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}

/* Dialog */
dialog{border:1px solid var(--line2);padding:0;border-radius:6px;background:#111113;color:var(--ink);width:min(880px,calc(100% - 20px));max-height:calc(100% - 40px);box-shadow:0 30px 80px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(2px)}
.dlg{padding:22px}
.dlg-head{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:12px}
.dlg-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.x{background:none;border:0;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.x:hover{color:#fff}

.prow{display:grid;grid-template-columns:minmax(120px,1.4fr) 62px 62px 62px 62px 100px 62px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prow.off{grid-template-columns:1fr}
.prow .pname{display:flex;gap:8px;align-items:center;font-weight:700}
.prow input[type=number]{padding:7px 8px}
.phead{font-family:var(--display);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chk{display:flex;align-items:center;gap:6px;font-size:.85rem}
input[type=checkbox]{accent-color:#E6E7EA;width:1.05rem;height:1.05rem}
@media (max-width:620px){
  .prow{grid-template-columns:repeat(3,1fr);row-gap:6px}
  .prow .pname{grid-column:1/-1}
  .phead{display:none}
  .prow .lbl{display:block;font-size:.65rem;color:var(--muted);font-family:var(--display);letter-spacing:.1em;text-transform:uppercase}
}
.lbl{display:none}
.summary{position:sticky;bottom:0;background:#1B1B1E;border:1px solid var(--line2);border-radius:4px;padding:12px 14px;margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 20px;font-variant-numeric:tabular-nums;font-size:.9rem}
.summary b{font-weight:700;color:#fff}
.summary.money-live{position:static;margin:0 0 4px;align-items:center}
.err{color:var(--warn);font-weight:700;font-size:.9rem;margin-top:8px}

/* Auth & brand screens */
.auth{max-width:420px;margin:24px auto;text-align:left}
.auth .btn{width:100%;margin-top:10px}
.auth-logo{display:block;width:min(220px,60%);height:auto;margin:6px auto 18px;filter:drop-shadow(0 0 24px rgba(255,255,255,.08))}
.auth h2{text-align:center}
.auth > .sub{text-align:center}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-family:var(--display);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;margin:18px 0 8px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}

.foot{max-width:1080px;margin:0 auto;padding:10px 20px 34px;text-align:center}
.motto-box{display:inline-block;position:relative;border:1px solid var(--line2);padding:14px 28px;margin-bottom:16px}
.motto-box::before,.motto-box::after{content:"\25C6";position:absolute;font-size:.55rem;color:var(--silver);top:-.45rem;left:50%;transform:translateX(-50%);background:var(--bg);padding:0 6px}
.motto-box::after{top:auto;bottom:-.45rem}
.motto-box span{display:block;font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;color:#D4D6DB;font-size:.78rem}
.motto-box strong{display:block;font-family:var(--display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:1.05rem;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.legal{font-family:var(--display);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.legal b{color:#D4D6DB;margin-right:10px;padding-right:10px;border-right:1px solid var(--line2)}

.kicker{margin:0 0 4px;font-family:var(--display);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:0}
.upcoming{border:1px solid var(--line2);background:linear-gradient(180deg,#17171A,#111113);border-radius:4px;padding:14px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.upcoming b{font-family:var(--display);letter-spacing:.06em}
.upcoming .meta{color:var(--muted);font-size:.86rem}
.rsvp{display:flex;gap:6px;flex-wrap:wrap}
.rsvp .btn{padding:6px 10px;font-size:.66rem}
.rsvp .btn[aria-pressed="true"]{background:var(--metal-flat);color:#0B0B0C;border-color:#E6E7EA}
.live .rsvp .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.live .rsvp .btn[aria-pressed="true"]{background:var(--metal-flat);color:#0B0B0C}
.bigchoice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 10px}
.bigchoice button{display:grid;gap:6px;justify-items:center;padding:30px 10px;border-radius:6px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.14em;text-transform:uppercase}
.bigchoice small{font-family:var(--body);font-size:.85rem;letter-spacing:0;text-transform:none;font-weight:400;opacity:.8}
.choice-rebuy{background:var(--metal-flat);color:#0B0B0C;border:1px solid #E6E7EA}
.choice-out{background:linear-gradient(180deg,#3A1215,#1E0809);color:#fff;border:1px solid rgba(224,102,106,.7)}
.bigchoice button:active{transform:scale(.98)}
.ko-hero{text-align:center;display:grid;justify-items:center;gap:6px}
.ko-hero h2{font-size:1.5rem}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.seat{border:1px solid var(--line2);border-radius:4px;padding:12px 8px 8px;text-align:center;background:var(--surface);display:grid;justify-items:center;gap:4px}
.seat .nm{font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.seat .tg{font-size:.74rem;color:var(--muted)}
.ko.out{opacity:.85}
.ko.out .meta{color:var(--muted);font-size:.84rem}
.feed{border-left:1px solid var(--line2);margin-left:6px;padding-left:18px;display:grid;gap:12px}
.feed .ev{position:relative;font-size:.92rem;line-height:1.45}
.feed .ev::before{content:"";position:absolute;left:-23px;top:.45em;width:9px;height:9px;border-radius:50%;background:#C9CBD0}
.feed .ev.ko-out::before{background:var(--warn)}
.feed .ev.deal::before{background:#E2BE5E}
.feed .ev.wait::before{background:var(--bg);border:1px dashed #C9CBD0}
.feed time{color:var(--muted);font-size:.78rem;margin-right:8px;font-variant-numeric:tabular-nums}
.deal{border:1px solid rgba(214,170,70,.5);background:linear-gradient(180deg,#1B1609,#0F0C06);border-radius:4px;padding:14px 16px;margin:14px 0}
.deal .kicker{color:#E2BE5E}
.deal-rows{display:grid;gap:8px;margin:8px 0}
.deal-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.deal-row .amt{font-family:var(--display);font-weight:700}
.deal-row input{width:130px}
label.deal-row{grid-template-columns:auto 1fr auto}
.champ{display:flex;gap:16px;align-items:center;border:1px solid rgba(214,170,70,.55);background:linear-gradient(135deg,#2A2110,#0F0C06 70%);border-radius:6px;padding:16px;margin-bottom:14px}
.champ .kicker{color:#E2BE5E}
.admin-live{border:1px dashed var(--line2);border-radius:4px;padding:4px 14px 14px;margin:14px 0}
.admin-live h3{margin-top:16px}
.ko .meta{color:var(--muted);font-size:.84rem}
.summary-img{display:block;width:100%;max-width:440px;margin:0 auto;border:1px solid var(--line2);border-radius:4px}
input[type=time]{border:1px solid var(--line2);background:#0E0E10;border-radius:4px;padding:9px 10px;width:100%;color:var(--ink);font-family:var(--body);font-size:1rem;color-scheme:dark}
.stat b small{font-size:.9rem;color:var(--muted);font-family:var(--body)}
.hero-live{position:relative;overflow:hidden;border:1px solid rgba(192,57,62,.65);border-radius:8px;padding:22px 18px 18px;margin-bottom:20px;
  background:radial-gradient(500px 220px at 85% -20%,rgba(192,57,62,.35),transparent 70%),linear-gradient(180deg,#1C0F11,#0E0909)}
.hero-live::after{content:"\2660";position:absolute;right:14px;top:-6px;font-size:7rem;color:rgba(255,255,255,.04);pointer-events:none}
.hero-live .kicker{color:#F2A3A6}
.hero-live h2{font-size:clamp(1.5rem,6vw,2.1rem);margin:2px 0 6px}
.hero-live .nums{display:flex;gap:18px;flex-wrap:wrap;color:#D4D6DB;font-size:.95rem;margin-bottom:16px}
.hero-live .nums b{font-family:var(--display);font-size:1.25rem;color:#fff;margin-right:4px}
.hero-actions{display:grid;gap:10px}
.btn-xl{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;padding:16px 18px;border-radius:8px;cursor:pointer;
  font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line2);background:transparent;color:var(--ink)}
.btn-xl.primary{background:var(--metal-flat);color:#0B0B0C;border-color:#E6E7EA;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.btn-xl.alert{background:linear-gradient(180deg,#C0393E,#8E2226);color:#fff;border-color:#E0666A}
.btn-xl:active{transform:scale(.985)}
.livebar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(7,7,8,0),rgba(7,7,8,.92) 30%);display:flex;justify-content:center}
.livebar .btn-xl{max-width:560px;min-height:58px}
body.has-livebar main{padding-bottom:110px}
.victims.big{grid-template-columns:repeat(2,1fr);gap:12px}
.victims.big .victim{padding:20px 8px;font-size:1.05rem}
.victims.big .victim .av{width:4rem;height:4rem;font-size:2rem}
.inapp{border:1px solid rgba(226,190,94,.6);background:#1B1609;border-radius:6px;padding:12px 14px;margin:0 0 14px;font-size:.92rem;line-height:1.5}
.inapp b{color:#E2BE5E}
.req-item{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--metal-flat);color:#0B0B0C;padding:10px 18px;border-radius:4px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90%;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.btn{transition:none}}
</style>
</head>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const money = (n, cur=true) => { const v = num(n); const s = (v<0?'-':'') + '$' + Math.abs(v).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}); return cur ? s+' MXN' : s; };
const fdate = iso => { if(!iso) return '—'; const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; };
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const parseList = s => String(s).split(/[,\s]+/).map(x=>x.trim()).filter(Boolean).map(Number).filter(n=>isFinite(n));
const EMOJIS=['🃏','♠️','♥️','♦️','♣️','🦈','🐟','🦊','🐺','🦁','🐍','🤠','😎','🧊','🔥','💰','👑','🎩','🍀','🎲','🚀','🐉','🥷','🍺'];
const COLORS={rojo:'#8E2A2E',azul:'#2D4F80',verde:'#2C5B4B',negro:'#050506',morado:'#4F3672',naranja:'#8A4B1F',dorado:'#8C7232',gris:'#5D6067'};
function profileOf(pid){ let best=null; for(const [uid,p] of Object.entries(S.profiles)){ if(p.playerId===pid && (!best || (p.linkedAt||'')<(best.linkedAt||''))) best={...p,uid}; } return best; }
const pname = id => { const pr=profileOf(id); const nick=pr&&typeof pr.nickname==='string'?pr.nickname.trim().slice(0,30):''; return nick || (S.players.find(p=>p.id===id)||{}).name || 'Jugador eliminado'; };
const realName = id => (S.players.find(p=>p.id===id)||{}).name || '';
const THEMES={noche:['Noche','linear-gradient(135deg,#1A1A1D,#050506 75%)'],plata:['Plata','linear-gradient(135deg,#6A6E76,#1B1C1F 72%)'],oro:['Oro','linear-gradient(135deg,#7E5F1F,#17110A 72%)'],cobre:['Cobre','linear-gradient(135deg,#7D4123,#170C07 72%)'],sangre:['Sangre','linear-gradient(135deg,#6E161A,#110506 72%)'],esmeralda:['Esmeralda','linear-gradient(135deg,#15553F,#04110C 72%)'],zafiro:['Zafiro','linear-gradient(135deg,#1D3C72,#050A15 72%)'],purpura:['Púrpura','linear-gradient(135deg,#46295F,#0C0613 72%)']};
const safePhoto = v => (typeof v==='string' && v.length<200000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v)) ? v : '';
function avatarFrom(pr, name, cls=''){ pr=pr||{}; const color=COLORS[pr.color]||'var(--sunk)'; const photo=safePhoto(pr.photo); const emo=EMOJIS.includes(pr.emoji)?pr.emoji:'';
  const ini=String(name||'?').split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
  return `<span class="av ${cls}" style="--avc:${color}" aria-hidden="true">${photo?`<img src="${photo}" alt="">`:(emo||esc(ini))}</span>`; }
function avatar(pid, cls=''){ return avatarFrom(profileOf(pid)||{}, pname(pid), cls); }

const myPlayer = () => S.uid && S.profiles[S.uid] ? S.profiles[S.uid].playerId || null : null;
const sname = id => (S.seasons.find(s=>s.id===id)||{}).name || 'Sin temporada';
let toastT; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
const chip = (pos) => pos<=3 ? `<span class="chip p${pos}">${pos}</span>` : `<span class="chip plain">${pos}</span>`;

/* ---------- store ---------- */
function onDbErr(e){
  if(e && (e.code==='invalid_argument'||e.code==='permission-denied')){ render(); toast('Solo puedes consultar: no tienes permiso para capturar.'); }
  else if(e && e.code==='quota_exceeded'){ toast('Se llenó el espacio de la liga. Borra noches antiguas para seguir.'); }
  else toast('No se pudo guardar. Revisa tu conexión e intenta de nuevo.');
}
async function save(col, id, data){
  if(db){ try{ await db.collection(col).doc(id).set(data); return true; }catch(e){ onDbErr(e); return false; } }
  const arr=S[col]; const i=arr.findIndex(x=>x.id===id); const row={...data,id}; if(i>=0) arr[i]=row; else arr.push(row); render(); return true;
}
async function removeDoc(col, id){
  if(db){ try{ await db.collection(col).doc(id).delete(); return true; }catch(e){ onDbErr(e); return false; } }
  S[col]=S[col].filter(x=>x.id!==id); render(); return true;
}
let chain=Promise.resolve();
function queue(fn){ chain=chain.then(fn,fn); return chain; }
async function saveOwn(col, data){
  if(!S.uid) { toast('Inicia sesión para guardar.'); return false; }
  if(!db){ S[col][S.uid]={...data}; render(); return true; }
  try{ await db.collection(col).doc(S.uid).set(data); return true; }catch(e){ toast(e&&(e.code==='invalid_argument'||e.code==='permission-denied')?'Tu acceso no permite guardar este cambio.':'No se pudo guardar. Intenta de nuevo.'); return false; }
}
async function saveConfig(cfg){
  const clean={...cfg}; delete clean.id;
  if(db){ try{ await db.doc('league/config').set(clean); return true; }catch(e){ onDbErr(e); return false; } }
  S.config={...DEFAULT_CONFIG,...clean}; render(); return true;
}

/* ---------- calculations ---------- */
function pointsFor(pos){ const t=S.config.points||[]; return t[pos-1]!=null ? num(t[pos-1]) : num(S.config.participation); }
function costOf(n, r){ return num(n.buyIn) + num(r.rebuys)*num(n.rebuy) + num(r.addons)*num(n.addOn); }
function killsIn(n, pid){ const ko=n.knockouts||[]; if(ko.length) return ko.filter(k=>k.by===pid).length; const r=(n.results||[]).find(x=>x.playerId===pid); return r?num(r.kills):0; }
function h2h(nights){ const m={}; nights.filter(isFinal).forEach(n=>(n.knockouts||[]).forEach(k=>{ const key=k.by+'|'+k.victim; m[key]=(m[key]||0)+1; })); return m; }
function nightTitle(n){ return (n.jornada?`Jornada ${n.jornada}`:'Noche') + (n.date?` · ${fdate(n.date)}`:''); }
function nightSort(a,b){ if(a.seasonId===b.seasonId && a.jornada && b.jornada) return num(b.jornada)-num(a.jornada); return (b.date||'').localeCompare(a.date||'') || num(b.jornada)-num(a.jornada); }
function nightCalc(n){
  const res=n.results||[]; let total=0; res.forEach(r=>total+=costOf(n,r));
  const entries=res.length+res.reduce((a,r)=>a+num(r.rebuys),0); const fund=n.costsUnknown?0:Math.round((num(n.seasonFee)*entries + total*num(n.fundPct)/100)*100)/100; const prizes=res.reduce((a,r)=>a+num(r.prize),0);
  const winner=res.find(r=>num(r.position)===1);
  return { total, fund, pool: total-fund, prizes, players:res.length, winner: winner?winner.playerId:null };
}
function scopedNights(){ const ns = S.season==='all' ? S.nights : S.nights.filter(n=>n.seasonId===S.season); return [...ns].sort(nightSort); }
function standings(nights){
  const m={}; const get=id=>m[id]||(m[id]={id,points:0,played:0,wins:0,cashes:0,best:null,posSum:0,rebuys:0,addons:0,kills:0,invested:0,won:0,net:0,owed:0,unknown:0});
  nights.filter(isFinal).forEach(n=>(n.results||[]).forEach(r=>{
    const s=get(r.playerId), pos=num(r.position), cost=costOf(n,r);
    s.played++; s.points+=pointsFor(pos); if(pos===1) s.wins++; if(num(r.prize)>0) s.cashes++;
    s.best = s.best==null ? pos : Math.min(s.best,pos); s.posSum+=pos; s.rebuys+=num(r.rebuys); s.addons+=num(r.addons); s.kills+=killsIn(n,r.playerId);
    s.won+=num(r.prize);
    if(n.costsUnknown){ s.unknown++; } else { s.invested+=cost; s.net+=num(r.prize)-cost; if(!r.paid) s.owed+=cost; }
  }));
  return Object.values(m).map(s=>({...s, avg:s.played?s.posSum/s.played:0}))
    .sort((a,b)=>b.points-a.points || b.wins-a.wins || b.net-a.net);
}

/* ---------- render ---------- */
function render(){
  $('#leagueName').textContent = S.config.leagueName || 'Liga de Póker';
  document.title = S.config.leagueName || 'Liga de Póker';
  const sel=$('#seasonSel');
  const seasons=[...S.seasons].sort((a,b)=>(b.start||'').localeCompare(a.start||''));
  sel.innerHTML = seasons.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('') + `<option value="all">Todas</option>`;
  sel.value = S.season || 'all';
  if(S.tab==='ajustes' && S.role!=='admin') S.tab='tabla';
  document.querySelectorAll('.tabs button').forEach(b=>{ b.setAttribute('aria-selected', b.dataset.tab===S.tab); if(b.hasAttribute('data-admin')) b.hidden = S.role!=='admin'; });
  const n=$('#notice');
  if(S.role==='player'){ n.hidden=false; n.textContent = myPlayer() ? `Entraste como jugador: ${pname(myPlayer())}.` : 'Entraste como jugador. Ve a "Mi perfil" para decir quién eres en la liga.'; }
  else n.hidden=true;

  const app=$('#app');
  const inApp = S.mode==='live';
  $('.tabs').hidden=!inApp; $('#seasonWrap').hidden=!inApp; $('#logoutBtn').hidden = !(S.mode==='live'||S.mode==='pending');
  if(S.mode==='setup'){ n.hidden=true; app.innerHTML=`<div class="panel auth"><img class="auth-logo" src="${LOGO_SRC}" alt="OG Poker League"><h2>Falta configurar Firebase</h2><p class="sub">Abre <b>config.js</b> y pega los datos de tu proyecto de Firebase y tu correo de administrador. La guía de instalación explica cómo.</p></div>`; return; }
  if(S.mode==='login'){ n.hidden=true; app.innerHTML=viewLogin(); return; }
  if(S.mode==='pending'){ n.hidden=true; app.innerHTML=viewPending(); return; }
  if(S.mode==='pending_old'){ n.hidden=true; app.innerHTML=`<div class="panel auth"><img class="auth-logo" src="${LOGO_SRC}" alt="OG Poker League"><h2>Solicitud enviada</h2><p class="sub">Entraste como <b>${esc(S.email)}</b>. El administrador de la liga tiene que aprobar tu acceso. Esta pantalla se actualiza sola cuando te aprueben.</p></div>`; return; }
  if(S.mode==='loading' || (S.mode==='live' && !(S.loaded.players && S.loaded.nights && S.loaded.seasons && S.loaded.config))){ app.innerHTML='<p class="sub">Cargando la liga…</p>'; return; }
  const views={tabla:viewTabla,noches:viewNoches,jugadores:viewJugadores,dinero:viewDinero,perfil:viewPerfil,ajustes:viewAjustes};
  const ae=document.activeElement; const typing = ae && ae.dataset && ae.dataset.pf && app.contains(ae);
  if(!typing) app.innerHTML = liveBanner() + views[S.tab]();
  const mae=document.activeElement; const modalBusy = modal.open && mae && modal.contains(mae) && /^(INPUT|SELECT|TEXTAREA)$/.test(mae.tagName);
  if(modal.open && S.modalView && !S.draft && !modalBusy) S.modalView();
  if(S.mode==='live' && !S.draft) maybePrompt();
  updateLivebar();
}

        <label class="f" style="grid-column:1/-1">Frase icónica<input type="text" maxlength="100" data-pf="motto" value="${esc(P.motto)}" placeholder="Ej. All-in o nada"></label>

  return `<div class="panel empty">

    <p>${S.seasons.length?'✓ Temporada creada':'Crea una temporada en Ajustes.'}<br>${S.players.length?'✓ Jugadores registrados':'Agrega a los jugadores en la pestaña Jugadores.'}</p>

      ${!S.seasons.length?'<button class="btn primary" data-act="tab" data-tab="ajustes">Crear temporada</button>':''}
      ${!S.players.length?'<button class="btn" data-act="tab" data-tab="jugadores">Agregar jugadores</button>':''}

function viewTabla(){
  const setup=setupNeeded(); if(setup) return setup;
  const nights=scopedNights().filter(isFinal); const st=standings(nights);
  const title = S.season==='all' ? 'Histórico de todas las temporadas' : sname(S.season);
  if(!nights.length) return `<h2>${esc(title)}</h2><div class="panel empty"><p>Aún no hay noches registradas en esta temporada.</p>${S.canWrite?'<button class="btn primary" data-act="newNight">Registrar la primera noche</button>':''}</div>`;
  const top=st.slice(0,3); const order=[top[1],top[0],top[2]];
  const pod=order.map((s,i)=>{ if(!s) return '<div></div>'; const pos=st.indexOf(s)+1;
    return `<div class="pod place${pos} ${pos===1?'first':''}">${chip(pos)}<div class="who">${avatar(s.id)} ${esc(pname(s.id))}</div><div class="big">${s.points}</div><small>puntos</small></div>`; }).join('');
  const rows=st.map((s,i)=>`<tr class="click" data-act="viewPlayer" data-id="${esc(s.id)}">
    <td>${chip(i+1)}</td><td><span class="who-cell">${avatar(s.id)}<b>${esc(pname(s.id))}</b></span></td><td class="n pts">${s.points}</td>
    <td class="n">${s.played}</td><td class="n">${s.wins}</td><td class="n">${s.kills}</td><td class="n">${s.cashes}</td>
    <td class="n">${s.avg.toFixed(1)}</td><td class="n ${s.unknown===s.played?'':s.net>=0?'pos':'neg'}">${s.unknown===s.played?'—':money(s.net,false)}</td></tr>`).join('');
  return `<div class="spread"><div><h2>${esc(title)}</h2><p class="sub" style="margin:0">${nights.length} ${nights.length===1?'noche jugada':'noches jugadas'}</p></div>
    ${S.canWrite?'<button class="btn primary" data-act="newNight">Registrar noche</button>':''}</div>
    <div class="podium">${pod}</div>
    <div class="panel scroll" style="padding:4px 6px"><table>
      <thead><tr><th>Lugar</th><th>Jugador</th><th class="n">Puntos</th><th class="n">Jugadas</th><th class="n">1ros</th><th class="n">Elim.</th><th class="n">Premios</th><th class="n">Pos. prom.</th><th class="n">Neto (MXN)</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    ${killsBoard(st)}
    ${rivalBoard(nights)}
    <p class="sub" style="margin-top:12px;font-size:.85rem">Puntos por posición: ${(S.config.points||[]).map((p,i)=>`${i+1}º = ${p}`).join(', ')}; resto = ${S.config.participation}. Desempate: más primeros lugares, luego mejor neto.</p>`;
}

function rivalBoard(nights){
  const m=h2h(nights); const pairs={};
  Object.entries(m).forEach(([key,c])=>{ const [a,b]=key.split('|'); const k=[a,b].sort().join('|'); const p=pairs[k]||(pairs[k]={a:[a,b].sort()[0],b:[a,b].sort()[1],ab:0,ba:0}); if(a===p.a) p.ab+=c; else p.ba+=c; });
  const top=Object.values(pairs).sort((x,y)=>(y.ab+y.ba)-(x.ab+x.ba)).slice(0,5);
  if(!top.length) return '';
  return `<h3>Rivalidades más intensas</h3><div class="panel" style="padding:8px 14px">${top.map(p=>`<div class="rrow">
    <button class="name-btn" data-act="viewPlayer" data-id="${esc(p.a)}">${esc(pname(p.a))}</button>
    <span class="score"><b>${p.ab}</b><span>–</span><b>${p.ba}</b></span>
    <button class="name-btn r" data-act="viewPlayer" data-id="${esc(p.b)}">${esc(pname(p.b))}</button></div>`).join('')}</div>
    <p class="sub" style="font-size:.8rem;margin-top:6px">Veces que cada uno eliminó al otro.</p>`;
}
function killsBoard(st){
  const k=[...st].filter(s=>s.kills>0).sort((a,b)=>b.kills-a.kills||a.played-b.played);
  if(!k.length) return '';
  const max=k[0].kills;
  return `<h3>Ranking de eliminaciones</h3><div class="panel" style="padding:8px 14px">${k.map((s,i)=>`<div class="krow">
    <button class="name-btn" data-act="viewPlayer" data-id="${esc(s.id)}">${esc(pname(s.id))}</button>
    <div class="kbar"><span style="width:${Math.max(4,s.kills/max*100)}%"></span></div><b>${s.kills}</b><small>${(s.kills/s.played).toFixed(1)} por noche</small></div>`).join('')}</div>`;
}

function rivalsOf(id){
  const m=h2h(S.nights); const opp={};
  Object.entries(m).forEach(([key,c])=>{ const [a,b]=key.split('|');
    if(a===id){ (opp[b]||(opp[b]={id:b,won:0,lost:0})).won+=c; }
    if(b===id){ (opp[a]||(opp[a]={id:a,won:0,lost:0})).lost+=c; } });
  const list=Object.values(opp);
  const nem=[...list].filter(o=>o.lost>0).sort((x,y)=>y.lost-x.lost||x.won-y.won)[0]||null;
  const vic=[...list].filter(o=>o.won>0).sort((x,y)=>y.won-x.won||x.lost-y.lost)[0]||null;
  return {list,nem,vic};
}
function rivalDuo(id){
  const {nem,vic}=rivalsOf(id);
  const label=k=>k==='nem'?'Su némesis':'Su víctima favorita';
  const card=(o,kind)=>{ if(!o) return `<div class="rv ${kind}" style="cursor:default">${avatarFrom({},'?','md')}<div><small>${label(kind)}</small><b>Sin datos todavía</b><span class="c">Se calcula con "quién eliminó a quién"</span></div></div>`;
    const n=kind==='nem'?o.lost:o.won;
    return `<button class="rv ${kind}" data-act="viewPlayer" data-id="${esc(o.id)}">${avatar(o.id,'md')}<div><small>${label(kind)}</small><b>${esc(pname(o.id))}</b><span class="c">${n} ${n===1?'eliminación':'eliminaciones'} ${kind==='nem'?'en su contra':'a su favor'}</span></div></button>`; };
  return `<div class="duo">${card(nem,'nem')}${card(vic,'vic')}</div>`;
}
function rivalSection(id){
  const {list}=rivalsOf(id); if(!list.length) return '';
  const rows=[...list].sort((x,y)=>(y.won+y.lost)-(x.won+x.lost)).map(o=>`<tr class="click" data-act="viewPlayer" data-id="${esc(o.id)}"><td><span class="who-cell">${avatar(o.id)}<b>${esc(pname(o.id))}</b></span></td><td class="n">${o.won}</td><td class="n">${o.lost}</td><td class="n ${o.won-o.lost>0?'pos':o.won-o.lost<0?'neg':''}">${o.won-o.lost>0?'+':''}${o.won-o.lost}</td></tr>`).join('');
  return `<h3>Cara a cara</h3><div class="panel scroll" style="padding:4px 8px"><table><thead><tr><th>Rival</th><th class="n">A favor</th><th class="n">En contra</th><th class="n">Balance</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="sub" style="font-size:.8rem;margin-top:6px">Histórico, solo de jornadas donde se capturó quién eliminó a quién.</p>`;
}
function moneyChart(id){
  const played=S.nights.filter(n=>isFinal(n) && (n.results||[]).some(r=>r.playerId===id));
  const known=played.filter(n=>!n.costsUnknown).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||num(a.jornada)-num(b.jornada));
  const unknown=played.length-known.length;
  const note=unknown?`<p class="sub" style="font-size:.8rem;margin:8px 6px 4px">No incluye ${unknown} jornada${unknown>1?'s':''} sin costos de entrada capturados.</p>`:'';
  if(!known.length) return `<h3>Ganancias y pérdidas</h3><div class="chart"><p class="sub" style="margin:10px 6px">La gráfica aparecerá cuando juegue jornadas con costos de entrada capturados.</p>${note}</div>`;
  let cum=0; const pts=known.map(n=>{ const r=n.results.find(x=>x.playerId===id); const net=num(r.prize)-costOf(n,r); cum+=net; return {n,net,cum}; });
  const W=640,H=250,L=70,R=14,T=14,B=34, iw=W-L-R, ih=H-T-B;
  const vals=[0,...pts.map(p=>p.net),...pts.map(p=>p.cum)]; let lo=Math.min(...vals), hi=Math.max(...vals); if(hi===lo){hi+=100;lo-=100;}
  const padv=(hi-lo)*.08; hi+=padv; lo-=padv;
  const y=v=>T+(hi-v)/(hi-lo)*ih; const step=iw/pts.length; const x=i=>L+step*i+step/2;
  const stepV=(()=>{ const raw=(hi-lo)/4; const e=Math.pow(10,Math.floor(Math.log10(raw))); const f=raw/e; return (f<=1?1:f<=2?2:f<=5?5:10)*e; })();
  const ticks=[]; for(let t=Math.ceil(lo/stepV)*stepV; t<=hi; t+=stepV) ticks.push(t);
  const short=v=>(v<0?'-':'')+'$'+Math.abs(Math.round(v)).toLocaleString('es-MX');
  const bw=Math.max(4,Math.min(28,step*.55));
  const bars=pts.map((p,i)=>`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${Math.min(y(p.net),y(0)).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,Math.abs(y(p.net)-y(0))).toFixed(1)}" fill="${p.net>=0?'#8CCFAA':'#E0666A'}" opacity=".55"><title>${esc(nightTitle(p.n))}: ${p.net>=0?'+':''}${money(p.net)}</title></rect>`).join('');
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.cum).toFixed(1)}`).join(' ');
  const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.cum).toFixed(1)}" r="3.2" fill="#F2F2F4"><title>Acumulado tras ${esc(nightTitle(p.n))}: ${money(p.cum)}</title></circle>`).join('');
  const every=Math.ceil(pts.length/10);
  const xl=pts.map((p,i)=>i%every===0||i===pts.length-1?`<text x="${x(i).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#9C9EA5">${p.n.jornada?'J'+p.n.jornada:fdate(p.n.date).slice(0,5)}</text>`:'').join('');
  const grid=ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="rgba(214,216,222,.10)"/><text x="${L-8}" y="${(y(t)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#9C9EA5">${short(t)}</text>`).join('');
  const total=pts[pts.length-1].cum;
  return `<h3>Ganancias y pérdidas</h3><div class="chart">
    <div class="chart-head"><span class="sub" style="margin:0">Balance acumulado (MXN)</span><b class="${total>=0?'pos':'neg'}">${total>=0?'+':''}${money(total)}</b></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ganancias y pérdidas por jornada; balance acumulado ${money(total)}">
      ${grid}<line x1="${L}" x2="${W-R}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="rgba(230,231,234,.45)"/>
      ${bars}<path d="${line}" fill="none" stroke="#F2F2F4" stroke-width="2"/>${dots}${xl}</svg>
    <div class="legend"><span><i style="background:#8CCFAA;opacity:.7"></i>Ganó en la jornada</span><span><i style="background:#E0666A;opacity:.7"></i>Perdió en la jornada</span><span><i style="background:#F2F2F4;height:2px"></i>Acumulado</span></div>${note}</div>`;
}

/* ---------- night form ---------- */
function nextJornada(seasonId){ return S.nights.filter(x=>x.seasonId===seasonId).reduce((m,x)=>Math.max(m,num(x.jornada)),0)+1; }
function startDraft(n, opts={}){
  const c=S.config;
  const base = n ? JSON.parse(JSON.stringify(n)) : { id:null, seasonId: S.season!=='all'&&S.season ? S.season : (c.activeSeason||(S.seasons[0]||{}).id), date:today(), place:'', notes:'',
    buyIn:num(c.buyIn), rebuy:num(c.rebuy), addOn:num(c.addOn), seasonFee:num(c.seasonFee), fundPct:num(c.fundPct), results:[] };
  if(!n) base.jornada = nextJornada(base.seasonId);
  base.map={}; (base.results||[]).forEach(r=>base.map[r.playerId]={...r}); delete base.results;
  if(n && opts.toLive){ Object.entries(rsvpOf(n)).forEach(([pid,v])=>{ if(v==='voy'&&!base.map[pid]) base.map[pid]={playerId:pid,position:0,kills:0,rebuys:0,addons:0,prize:0,paid:true,out:false}; }); base.toLive=true; }
  if(n && opts.closing){ const pos=livePositions(n); const taken=new Set(Object.values(pos)); let next=1;
    Object.values(base.map).forEach(r=>{ if(pos[r.playerId]) r.position=pos[r.playerId]; else { while(taken.has(next)) next++; r.position=next; taken.add(next); } });
    fillPrizes(base); base.closing=true; }
  S.modalView=null; S.draft=base; nightForm();
}

  else if(d.status==='scheduled') btns+='<button class="btn" data-act="saveScheduled">Guardar cambios</button><button class="btn primary" data-act="saveLive">Abrir en vivo</button>';
  else if(d.status==='live') btns+='<button class="btn primary" data-act="saveLive">Guardar cambios</button>';
  else btns+='<button class="btn primary" data-act="saveNight">Guardar noche</button>';
  const help=d.closing?'Los lugares vienen del orden de eliminación y los premios del trato o del reparto por %. Revisa, marca quién pagó y cierra.'

      <label class="f">Mesa final: fijo por entrada (MXN)<input type="number" min="0" data-g="seasonFee" value="${esc(d.seasonFee)}"></label>

    <div class="prow phead" ${ids.size?'':'hidden'}><span>Jugador</span><span>Lugar</span><span>Elim.</span><span>Rebuys</span><span>Add-ons</span><span>Premio</span><span>Pagó</span></div>

function draftCalc(){ const d=S.draft; const n={buyIn:d.buyIn,rebuy:d.rebuy,addOn:d.addOn,seasonFee:d.seasonFee,fundPct:d.fundPct,costsUnknown:d.costsUnknown,results:Object.values(d.map)}; return nightCalc(n); }
function updateSummary(){
  const c=draftCalc(); const diff=c.pool-c.prizes; const el=$('#sum'); if(!el) return;
  el.innerHTML=`<span>Jugadores <b>${c.players}</b></span><span>Bote <b>${money(c.total)}</b></span>${c.fund?`<span>Mesa final <b>${money(c.fund)}</b></span>`:''}
    <span>A repartir <b>${money(c.pool)}</b></span><span>Premios capturados <b>${money(c.prizes)}</b></span>${c.players&&Math.abs(diff)>0.009?`<span class="${diff<0?'neg':''}">${diff>0?'Falta repartir':'Excede por'} <b>${money(Math.abs(diff))}</b></span>`:''}`;
}
function fillPrizes(d){
  const rs=Object.values(d.map); rs.forEach(r=>r.prize=0);
  if(d.deal&&d.deal.amounts){ rs.forEach(r=>{ if(d.deal.amounts[r.playerId]!=null) r.prize=num(d.deal.amounts[r.playerId]); }); return 'Premios según el trato'; }
  const c=nightCalc({buyIn:d.buyIn,rebuy:d.rebuy,addOn:d.addOn,seasonFee:d.seasonFee,fundPct:d.fundPct,costsUnknown:d.costsUnknown,results:rs}); const pct=S.config.payout||[];
  let assigned=0; const byPos={};
  pct.forEach((p,i)=>{ const r=rs.find(x=>num(x.position)===i+1); if(r){ const v=Math.floor(c.pool*num(p)/100); r.prize=v; assigned+=v; byPos[i+1]=r; } });
  if(byPos[1]) byPos[1].prize += Math.round((c.pool-assigned)*100)/100;
  return 'Premios calculados: '+pct.map((p,i)=>`${i+1}º ${p}%`).join(', ');
}
function autoPrize(){ const msg=fillPrizes(S.draft); nightForm(); toast(msg); }
async function saveNight(mode){
  if(mode===true) mode='live'; if(mode===false||mode==null) mode='final';
  const d=S.draft; const rs=Object.values(d.map); const err=$('#formErr');
  const n=rs.length; const pos=rs.map(r=>num(r.position)).sort((a,b)=>a-b);
  if(!d.seasonId) return err.textContent='Elige una temporada (créala en Ajustes si no hay).';
  if(!d.date && !num(d.jornada)) return err.textContent='Captura la fecha o el número de jornada.';
  if(mode==='live' && n<2) return err.textContent='Marca al menos 2 jugadores para abrir la mesa.';
  if(mode==='final'){
    if(n<2) return err.textContent='Marca al menos 2 jugadores.';
    if(pos.some(p=>p<1)) return err.textContent='Cada jugador necesita un lugar (1 o más).';
    if(pos.some((p,i)=>p!==i+1) && !confirm(`Los lugares no van del 1 al ${n} sin repetirse. ¿Guardar así de todos modos?`)) return;
  }
  const kos=d.knockouts||[]; const keepLive = mode!=='final' || d.status==='live';

    knockouts:kos.map(k=>({by:k.by,victim:k.victim,...(k.kind?{kind:k.kind}:{}),...(k.at?{at:k.at}:{}),...(k.claim?{claim:k.claim}:{})})),
    results:rs.map(r=>{ const o={playerId:r.playerId,position:num(r.position),kills:kos.length?kos.filter(k=>k.by===r.playerId).length:num(r.kills),rebuys:num(r.rebuys),addons:num(r.addons),prize:num(r.prize),paid:!!r.paid};
      if(keepLive){ o.out=!!r.out; if(num(r.outOrder)) o.outOrder=num(r.outOrder); o.joinedAt=r.joinedAt||nowISO(); } return o; }),
    updatedAt:nowISO()};
  if(d.deal) doc.deal=d.deal; if(d.costsUnknown) doc.costsUnknown=true;
  const id=d.id||newId('n'); const wasLive=d.status==='live';
  if(await save('nights',id,doc)){ closeModal();
    toast(mode==='live'?(wasLive?'Cambios guardados':'¡Mesa abierta! Ya pueden registrar eliminaciones.'):mode==='scheduled'?'Jornada programada: ya pueden confirmar asistencia.':'Jornada guardada');
    if(mode==='final' && wasLive) setTimeout(()=>shareSummary(id),400); }
}

/* ================= JORNADA EN VIVO ================= */
const isFinal = n => !n.status || n.status==='final';
const nowISO = () => new Date().toISOString();
const hhmm = iso => { if(!iso) return ''; const d=new Date(iso); return isNaN(d)?'':d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); };
const uidOf = pid => (profileOf(pid)||{}).uid || null;
const seated = n => n.results||[];
const alive = n => seated(n).filter(r=>!r.out);
const outsOf = n => seated(n).filter(r=>r.out).sort((a,b)=>num(a.outOrder)-num(b.outOrder));
function livePositions(n){ const N=seated(n).length, pos={}; outsOf(n).forEach((r,i)=>pos[r.playerId]=N-i); const al=alive(n); if(al.length===1) pos[al[0].playerId]=1; return pos; }
S.snoozed = S.snoozed || {};

/* --- acciones propias del jugador (un documento por cuenta) --- */
function myActions(){ const a=S.claims[S.uid]||{}; return {by:a.by||null, items:a.items||[], responses:a.responses||{}, rsvp:a.rsvp||{}, deals:a.deals||[], votes:a.votes||{}}; }
function saveActions(patch){ return queue(async()=>{ const cur=myActions(); const data={...cur,...patch,by:myPlayer()||cur.by||null};
  data.items=data.items.slice(-400); data.deals=data.deals.slice(-50); return await saveOwn('claims',data); }); }

/* --- eliminaciones --- */
function claimItems(nightId){ const out=[]; for(const [uid,doc] of Object.entries(S.claims)){ const by=(S.profiles[uid]||{}).playerId;
  (doc.items||[]).forEach(it=>{ if(it.night!==nightId) return; const key=uid+':'+it.id; const vu=uidOf(it.victim);
    const ch=vu&&S.claims[vu]&&S.claims[vu].responses?S.claims[vu].responses[key]:null;
    out.push({...it,uid,by,key,choice:['rebuy','out','dispute'].includes(ch)?ch:null}); }); }
  return out.sort((a,b)=>(a.at||'').localeCompare(b.at||'')); }
function claimStatus(n, key){ if((n.knockouts||[]).some(k=>k.claim===key)) return 'ok'; if((n.rejected||[]).includes(key)) return 'no'; return 'wait'; }
function pendingClaims(n){ return claimItems(n.id).filter(c=>claimStatus(n,c.key)==='wait'); }
function withKO(n, list){
  const res=seated(n).map(r=>({...r})); const knockouts=[...(n.knockouts||[])];
  for(const ko of list){ const v=res.find(r=>r.playerId===ko.victim); if(!v||v.out) continue;
    if(ko.kind==='rebuy') v.rebuys=num(v.rebuys)+1; else { v.out=true; v.outOrder=res.reduce((m,r)=>Math.max(m,num(r.outOrder)),0)+1; }
    knockouts.push({by:ko.by,victim:ko.victim,kind:ko.kind,at:nowISO(),...(ko.claim?{claim:ko.claim}:{})}); }
  res.forEach(r=>r.kills=knockouts.filter(k=>k.by===r.playerId).length);
  return {results:res,knockouts};
}
async function patchNight(n, patch, msg){ const {id,...rest}=n; const ok=await save('nights',id,{...rest,...patch,updatedAt:nowISO()}); if(ok&&msg) toast(msg); return ok; }

/* --- asistencia --- */
function rsvpOf(n){ const out={}; for(const [uid,doc] of Object.entries(S.claims)){ const pid=(S.profiles[uid]||{}).playerId; const v=doc.rsvp&&doc.rsvp[n.id]; if(pid&&['voy','tarde','no'].includes(v)) out[pid]=v; } return out; }
function onTheWay(n){ const r=rsvpOf(n), sit=new Set(seated(n).map(x=>x.playerId)); return Object.entries(r).filter(([pid,v])=>v!=='no'&&!sit.has(pid)).map(([pid,v])=>({pid,v})); }

/* --- trato entre los últimos 3 --- */
function dealList(n){ const al=alive(n).map(r=>r.playerId).sort().join(','); const out=[];
  for(const [uid,doc] of Object.entries(S.claims)){ const by=(S.profiles[uid]||{}).playerId;
    (doc.deals||[]).forEach(d=>{ if(d.night!==n.id||!d.amounts) return; out.push({...d,uid,by,key:uid+':'+d.id,valid:Object.keys(d.amounts).sort().join(',')===al}); }); }
  return out.sort((a,b)=>(a.at||'').localeCompare(b.at||'')); }
function dealVotes(d){ const v={}; Object.keys(d.amounts).forEach(pid=>{ if(pid===d.by){ v[pid]='si'; return; } const u=uidOf(pid); const x=u&&S.claims[u]&&S.claims[u].votes?S.claims[u].votes[d.key]:null; v[pid]=(x==='si'||x==='no')?x:null; }); return v; }
function dealStatus(n,d){ if(n.deal&&n.deal.key===d.key) return 'approved'; if((n.dealRejected||[]).includes(d.key)) return 'denied'; if(!d.valid) return 'stale';
  const vals=Object.values(dealVotes(d)); if(vals.includes('no')) return 'rejected'; if(vals.every(x=>x==='si')) return 'accepted'; return 'pending'; }
function activeDeal(n){ return [...dealList(n)].reverse().find(d=>['pending','accepted'].includes(dealStatus(n,d)))||null; }
function dealPot(n){ return nightCalc(n).pool; }

/* --- avisos que le saltan al jugador --- */
function myPrompts(){
  const me=myPlayer(); if(!me||S.role==='viewer') return [];
  const out=[];
  S.nights.filter(n=>n.status==='live').forEach(n=>{
    if(!seated(n).some(r=>r.playerId===me)) return;
    const mine=myActions().responses;
    pendingClaims(n).filter(c=>c.victim===me && !mine[c.key]).forEach(c=>out.push({type:'ko',n,c,key:'ko:'+c.key}));
    const d=activeDeal(n); if(d && d.by!==me && d.amounts[me]!=null && dealVotes(d)[me]==null && !n.deal) out.push({type:'deal',n,d,key:'deal:'+d.key});
  });
  return out;
}

function feedOf(n){
  const ev=[];
  seated(n).forEach(r=>{ if(r.joinedAt) ev.push({at:r.joinedAt,cls:'',html:`<b>${esc(pname(r.playerId))}</b> se sentó en la mesa`}); });
  (n.knockouts||[]).forEach(k=>{ if(!k.at) return; ev.push({at:k.at,cls:k.kind==='out'?'ko-out':'',html:`<b>${esc(pname(k.by))}</b> eliminó a <b>${esc(pname(k.victim))}</b> · ${k.kind==='rebuy'?'hizo rebuy':k.kind==='out'?'queda fuera':'eliminación'}`}); });
  pendingClaims(n).forEach(c=>ev.push({at:c.at,cls:'wait',html:`<b>${esc(c.by?pname(c.by):'?')}</b> dice que eliminó a <b>${esc(pname(c.victim))}</b> · ${c.choice==='rebuy'?'eligió rebuy':c.choice==='out'?'se rindió':c.choice==='dispute'?'lo disputa':'esperando respuesta'} <span class="tag wait">Por confirmar</span>`}));
  dealList(n).forEach(d=>{ const st=dealStatus(n,d); if(st==='stale') return; ev.push({at:d.at,cls:'deal',html:`<b>${esc(pname(d.by))}</b> propuso un trato · ${st==='approved'?'<span class="tag on">Cerrado</span>':st==='rejected'?'<span class="tag due">Rechazado</span>':st==='denied'?'<span class="tag due">No aprobado</span>':'<span class="tag wait">En votación</span>'}`}); });
  if(n.deal&&n.deal.approvedAt) ev.push({at:n.deal.approvedAt,cls:'deal',html:'<b>Trato cerrado</b> · se juega por los puntos'});
  return ev.filter(e=>e.at).sort((a,b)=>b.at.localeCompare(a.at));
}

function updateLivebar(){
  const bar=$('#livebar'); if(!bar) return; const me=myPlayer(); let html='';
  if(S.mode==='live'){ const n=S.nights.find(x=>x.status==='live'); if(n){ const seat=seated(n).find(r=>r.playerId===me); const myP=myPrompts().filter(p=>p.n.id===n.id); const pend=pendingClaims(n).length;
    if(myP.length) html=`<button class="btn-xl alert" data-act="${myP[0].type==='ko'?'openVictim':'openDealVote'}" data-night="${esc(n.id)}" data-key="${esc(myP[0].type==='ko'?myP[0].c.key:myP[0].d.key)}">${myP[0].type==='ko'?'Te eliminaron · responder':'Votar el trato'}</button>`;
    else if(seat&&!seat.out) html=`<button class="btn-xl primary" data-act="claimSheet" data-id="${esc(n.id)}">Eliminé a alguien</button>`;
    else if(S.role==='admin'&&pend) html=`<button class="btn-xl primary" data-act="viewNight" data-id="${esc(n.id)}">Aprobar ${pend} ${pend===1?'eliminación':'eliminaciones'}</button>`;
    else html=`<button class="btn-xl" style="background:rgba(20,20,22,.95)" data-act="viewNight" data-id="${esc(n.id)}"><span class="dot"></span>${esc(nightTitle(n))} en vivo</button>`; } }
  bar.innerHTML=html; bar.hidden=!html||modal.open; document.body.classList.toggle('has-livebar',!!html);
}
function liveBanner(){
  const me=myPlayer(); let html='';
  S.nights.filter(n=>n.status==='scheduled').sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(n=>{
    const r=rsvpOf(n); const v=Object.values(r); const mine=r[me]||null;
    html+=`<div class="upcoming"><div><p class="kicker">Próxima jornada</p><b>${esc(nightTitle(n))}</b><div class="meta">${n.time?'A las '+esc(n.time)+' · ':''}${(c=>c===1?'1 va':c+' van')(v.filter(x=>x==='voy').length)} · ${(c=>c===1?'1 llega tarde':c+' llegan tarde')(v.filter(x=>x==='tarde').length)}</div></div>
      <div class="row">${me?rsvpButtons(n,mine):''}<button class="btn sm" data-act="viewNight" data-id="${esc(n.id)}">${S.role==='admin'?'Ver e iniciar':'Ver'}</button></div></div>`; });
  S.nights.filter(n=>n.status==='live').forEach(n=>{
    const seat=seated(n).find(r=>r.playerId===me); const myP=myPrompts().filter(p=>p.n.id===n.id); const pend=pendingClaims(n).length; const al=alive(n).length; const c=nightCalc(n);
    let acts='';
    if(myP.length) acts+=`<button class="btn-xl alert" data-act="${myP[0].type==='ko'?'openVictim':'openDealVote'}" data-night="${esc(n.id)}" data-key="${esc(myP[0].type==='ko'?myP[0].c.key:myP[0].d.key)}">${myP[0].type==='ko'?'Te eliminaron · responder':'Votar el trato'}</button>`;
    if(seat&&!seat.out) acts+=`<button class="btn-xl primary" data-act="claimSheet" data-id="${esc(n.id)}">Eliminé a alguien</button>`;
    if(S.role==='admin') acts+=`<button class="btn-xl ${seat&&!seat.out?'':'primary'}" data-act="viewNight" data-id="${esc(n.id)}">${pend?`Aprobar ${pend} ${pend===1?'eliminación':'eliminaciones'}`:'Administrar la mesa'}</button>`;
    else acts+=`<button class="btn-xl" data-act="viewNight" data-id="${esc(n.id)}">Ver la mesa en vivo</button>`;
    const notSeated = me && !seat && S.role!=='viewer';
    html+=`<section class="hero-live" aria-label="Jornada en vivo"><p class="kicker"><span class="dot"></span>En vivo ahora${n.place?' · '+esc(n.place):''}</p><h2>${esc(nightTitle(n))}</h2>
      <div class="nums"><span><b>${al}</b>en pie de ${seated(n).length}</span><span><b>${money(c.total,false)}</b>de bote</span>${n.deal?'<span><b>Trato</b>cerrado</span>':''}</div>
      <div class="hero-actions">${acts}</div>
      ${notSeated?`<p class="sub" style="margin:14px 0 6px;font-size:.85rem">¿Vienes en camino? Avísale a la mesa:</p>${rsvpButtons(n,rsvpOf(n)[me]||null)}`:''}</section>`; });
  return html;
}

function loadImg(src){ return new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=src; }); }
async function drawSummary(n){
  try{ if(document.fonts&&document.fonts.load) await Promise.all(['700 90px Cinzel','600 28px Cinzel','700 34px Lato','400 28px Lato'].map(f=>document.fonts.load(f))); }catch(_){}
  const W=1080,H=1350,cv=document.createElement('canvas'); cv.width=W; cv.height=H; const g=cv.getContext('2d');
  const bg=g.createRadialGradient(W/2,-120,60,W/2,260,1150); bg.addColorStop(0,'#2A2A2F'); bg.addColorStop(1,'#09090A'); g.fillStyle=bg; g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(220,222,228,.5)'; g.lineWidth=2; g.strokeRect(32,32,W-64,H-64); g.strokeStyle='rgba(220,222,228,.18)'; g.lineWidth=1; g.strokeRect(46,46,W-92,H-92);
  const grad=(y0,y1,stops)=>{ const m=g.createLinearGradient(0,y0,0,y1); stops.forEach((c,i)=>m.addColorStop(i/(stops.length-1),c)); return m; };
  const SILVER=['#FFFFFF','#D9DADD','#8D9098','#F0F0F2'], GOLD=['#FFF3C8','#E2BE5E','#9C7424','#F1D78A'], COPPER=['#FBD9C2','#C98256','#7E4222','#E3A57E'];
  const spaced=(t,x,y,sp)=>{ if('letterSpacing' in g){ g.letterSpacing=sp+'px'; g.fillText(t,x,y); g.letterSpacing='0px'; } else g.fillText(t,x,y); };
  const fit=(t,max)=>{ t=String(t); while(t.length>3&&g.measureText(t).width>max) t=t.slice(0,-2)+'…'; return t; };
  g.textAlign='center'; g.textBaseline='alphabetic';
  try{ const emb=await loadImg(document.querySelector('.brandmark .emblem').src); const w=170,h=w*emb.height/emb.width; g.drawImage(emb,W/2-w/2,72,w,h); }catch(_){}
  g.font='700 92px Cinzel, Georgia, serif'; g.fillStyle=grad(250,340,SILVER); spaced(n.jornada?'JORNADA '+n.jornada:'RESULTADOS',W/2,340,4);
  g.font='600 26px Cinzel, Georgia, serif'; g.fillStyle='#BFC1C7'; spaced([fdate(n.date),n.place].filter(x=>x&&x!=='—').join('   ·   ').toUpperCase()||sname(n.seasonId).toUpperCase(),W/2,390,6);
  g.strokeStyle='rgba(220,222,228,.35)'; g.beginPath(); g.moveTo(W/2-260,425); g.lineTo(W/2-18,425); g.moveTo(W/2+18,425); g.lineTo(W/2+260,425); g.stroke();
  g.fillStyle='#C9CBD0'; g.save(); g.translate(W/2,425); g.rotate(Math.PI/4); g.fillRect(-6,-6,12,12); g.restore();
  const res=[...seated(n)].sort((a,b)=>num(a.position)-num(b.position));
  const spots=[{r:res[1],x:W/2-320,R:82,y:575,c:SILVER,l:'2º'},{r:res[0],x:W/2,R:104,y:545,c:GOLD,l:'1º'},{r:res[2],x:W/2+320,R:82,y:575,c:COPPER,l:'3º'}];
  for(const s of spots){ if(!s.r) continue; const pid=s.r.playerId; const pr=profileOf(pid)||{};
    g.beginPath(); g.arc(s.x,s.y,s.R+8,0,Math.PI*2); g.fillStyle=grad(s.y-s.R,s.y+s.R,s.c); g.fill();
    g.save(); g.beginPath(); g.arc(s.x,s.y,s.R,0,Math.PI*2); g.clip(); g.fillStyle=COLORS[pr.color]||'#1E1E22'; g.fillRect(s.x-s.R,s.y-s.R,s.R*2,s.R*2);
    const ph=safePhoto(pr.photo); if(ph){ try{ const im=await loadImg(ph); g.drawImage(im,s.x-s.R,s.y-s.R,s.R*2,s.R*2); }catch(_){} }
    else { const emo=EMOJIS.includes(pr.emoji)?pr.emoji:''; g.fillStyle='#F2F2F4'; g.font=`700 ${Math.round(s.R*.8)}px Lato, Arial, sans-serif`; g.textBaseline='middle';
      g.fillText(emo||pname(pid).split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase(),s.x,s.y+4); g.textBaseline='alphabetic'; }
    g.restore();
    g.font='700 40px Cinzel, Georgia, serif'; g.fillStyle=grad(s.y+s.R+20,s.y+s.R+60,s.c); g.fillText(s.l,s.x,s.y+s.R+62);
    g.font='700 34px Lato, Arial, sans-serif'; g.fillStyle='#F2F2F4'; g.fillText(fit(pname(pid),270),s.x,s.y+s.R+106);
    g.font='400 27px Lato, Arial, sans-serif'; g.fillStyle='#BFC1C7'; g.fillText(`${pointsFor(num(s.r.position))} pts${num(s.r.prize)?' · '+money(s.r.prize,false):''}`,s.x,s.y+s.R+146);
  }
  let y=885; const rest=res.slice(3); const maxRows=Math.min(rest.length,8);
  g.font='600 22px Cinzel, Georgia, serif'; g.fillStyle='#9C9EA5'; g.textAlign='left'; spaced('LUGAR   JUGADOR',150,y,4); g.textAlign='right'; spaced('PTS   ELIM.',W-150,y,4);
  y+=16; g.strokeStyle='rgba(220,222,228,.2)'; g.beginPath(); g.moveTo(150,y); g.lineTo(W-150,y); g.stroke();
  for(let i=0;i<maxRows;i++){ const r=rest[i]; y+=46; g.textAlign='left'; g.font='700 28px Cinzel, Georgia, serif'; g.fillStyle='#C9CBD0'; g.fillText(num(r.position)+'º',150,y);
    g.font='700 29px Lato, Arial, sans-serif'; g.fillStyle='#F2F2F4'; g.fillText(fit(pname(r.playerId),520),245,y);
    g.textAlign='right'; g.font='400 28px Lato, Arial, sans-serif'; g.fillStyle='#BFC1C7'; g.fillText(`${pointsFor(num(r.position))}      ${killsIn(n,r.playerId)}`,W-150,y); }
  if(rest.length>maxRows){ y+=40; g.textAlign='center'; g.font='400 24px Lato, Arial, sans-serif'; g.fillStyle='#9C9EA5'; g.fillText(`+${rest.length-maxRows} jugadores más`,W/2,y); }
  const c=nightCalc(n); g.textAlign='center';
  g.font='600 24px Cinzel, Georgia, serif'; g.fillStyle='#D4D6DB'; spaced(`BOTE ${money(c.total,false)} MXN   ·   ${seated(n).length} JUGADORES   ·   ${seated(n).reduce((a,r)=>a+num(r.rebuys),0)} REBUYS`,W/2,H-190,3);
  if(n.deal){ g.font='400 24px Lato, Arial, sans-serif'; g.fillStyle='#E2BE5E'; g.fillText('Trato entre '+Object.keys(n.deal.amounts).map(pname).join(', ')+' · se jugó por los puntos',W/2,H-150); }
  g.font='700 30px Cinzel, Georgia, serif'; g.fillStyle=grad(H-110,H-70,SILVER); spaced('A NADIE LE IMPORTA LO QUE FOLDEASTE.',W/2,H-88,3);
  return cv;
}
async function shareSummary(id){
  const n=S.nights.find(x=>x.id===id); if(!n) return;
  S.modalView=null;
  openModal(`<div class="dlg-head"><div><p class="kicker">Resumen para el grupo</p><h2>${esc(nightTitle(n))}</h2></div><button class="x" data-act="close" aria-label="Cerrar">×</button></div><p class="sub">Generando imagen…</p>`);
  const cv=await drawSummary(n); const url=cv.toDataURL('image/png'); S.summaryCanvas=cv; S.summaryName=`og-poker-${n.jornada?'jornada-'+n.jornada:'resultados'}.png`;
  openModal(`<div class="dlg-head"><div><p class="kicker">Resumen para el grupo</p><h2>${esc(nightTitle(n))}</h2></div><button class="x" data-act="close" aria-label="Cerrar">×</button></div>
    <img class="summary-img" src="${url}" alt="Resumen de ${esc(nightTitle(n))}">
    <div class="dlg-foot"><button class="btn" data-act="downloadSummary">Descargar imagen</button><button class="btn primary" data-act="shareSummaryNow">Compartir</button></div>`);
}
async function summaryBlob(){ return await new Promise(ok=>S.summaryCanvas.toBlob(ok,'image/png')); }

/* --- acciones de la jornada en vivo --- */
Object.assign(A,{
  snooze:()=>{ if(S.promptKey) S.snoozed[S.promptKey]=true; S.promptKey=null; closeModal(); },
  openVictim:ds=>{ delete S.snoozed['ko:'+ds.key]; victimPrompt(ds.night,ds.key); },
  openDealVote:ds=>{ delete S.snoozed['deal:'+ds.key]; dealVoteSheet(ds.night,ds.key); },
  respondKO:ds=>saveActions({responses:{...myActions().responses,[ds.key]:ds.v}}).then(ok=>{ if(ok){ S.promptKey=null; closeModal(); toast(ds.v==='rebuy'?'Pediste rebuy. El administrador lo confirma.':ds.v==='out'?'Te rendiste. ¡Buen juego!':'Le avisamos al administrador.'); } }),
  claimKO:ds=>{ const me=myPlayer(); if(!me) return; const cur=myActions();
    if(pendingClaims(S.nights.find(n=>n.id===ds.night)||{id:''}).some(c=>c.uid===S.uid&&c.victim===ds.victim)) return toast('Ya registraste esa eliminación; espera a que la confirmen.');
    saveActions({items:[...cur.items,{id:newId('k'),night:ds.night,victim:ds.victim,at:nowISO()}]}).then(ok=>{ if(ok){ toast('Registrado: eliminaste a '+pname(ds.victim)); closeModal(); } }); },
  unclaim:ds=>{ const cur=myActions(); saveActions({items:cur.items.filter(i=>i.id!==ds.id)}).then(ok=>ok&&toast('Eliminación quitada')); },
  approveKO:async ds=>{ const n=S.nights.find(x=>x.id===ds.night); const c=n&&pendingClaims(n).find(x=>x.key===ds.key); if(!c) return;
    const kind=ds.kind||c.choice; if(kind!=='rebuy'&&kind!=='out') return toast('Elige si fue rebuy o fuera.'); if(!c.by) return toast('Esa cuenta no está vinculada a un jugador.');
    const v=seated(n).find(r=>r.playerId===c.victim); if(!v||v.out) return toast(pname(c.victim)+' ya no está en la mesa.');
    await patchNight(n, withKO(n,[{by:c.by,victim:c.victim,kind,claim:c.key}]), kind==='rebuy'?'Rebuy aprobado':pname(c.victim)+' queda fuera'); },
  approveAllKO:async ds=>{ const n=S.nights.find(x=>x.id===ds.night); if(!n) return; const list=pendingClaims(n).filter(c=>c.by&&(c.choice==='rebuy'||c.choice==='out')).map(c=>({by:c.by,victim:c.victim,kind:c.choice,claim:c.key}));
    if(list.length) await patchNight(n, withKO(n,list), list.length+' aprobadas'); },
  rejectClaim:async ds=>{ const n=S.nights.find(x=>x.id===ds.night); if(n) await patchNight(n,{rejected:[...(n.rejected||[]),ds.key]},'Eliminación rechazada'); },
  adminKO:async ds=>{ const n=S.nights.find(x=>x.id===ds.night); const by=$('#lkBy').value, victim=$('#lkVictim').value;
    if(!by||!victim) return toast('Elige quién eliminó y a quién.'); if(by===victim) return toast('Un jugador no puede eliminarse a sí mismo.');
    await patchNight(n, withKO(n,[{by,victim,kind:ds.kind}]), ds.kind==='rebuy'?'Rebuy registrado':pname(victim)+' queda fuera'); },
  undoKO:async ds=>{ const n=S.nights.find(x=>x.id===ds.night); const i=num(ds.i); const k=n&&(n.knockouts||[])[i]; if(!k) return;
    if(!confirm(`¿Deshacer "${pname(k.by)} eliminó a ${pname(k.victim)}"?`)) return;
    const res=seated(n).map(r=>({...r})); const v=res.find(r=>r.playerId===k.victim);
    if(v){ if(k.kind==='rebuy') v.rebuys=Math.max(0,num(v.rebuys)-1); else if(k.kind==='out'){ v.out=false; delete v.outOrder; } }
    const knockouts=(n.knockouts||[]).filter((_,j)=>j!==i); res.forEach(r=>r.kills=knockouts.filter(x=>x.by===r.playerId).length);
    await patchNight(n,{results:res,knockouts,rejected:k.claim?[...(n.rejected||[]),k.claim]:(n.rejected||[])},'Eliminación deshecha'); },
  seatPlayer:async ds=>{ const n=S.nights.find(x=>x.id===ds.night); const pid=ds.pid||$('#seatSel').value; if(!pid) return toast('Elige quién llegó.');
    if(seated(n).some(r=>r.playerId===pid)) return toast('Ya está en la mesa.');
    await patchNight(n,{results:[...seated(n),{playerId:pid,rebuys:0,addons:0,kills:0,prize:0,paid:true,out:false,joinedAt:nowISO()}]},pname(pid)+' se sentó en la mesa'); },
  seatNew:async ds=>{ const n=S.nights.find(x=>x.id===ds.night); const name=$('#seatNew').value.trim(); if(!name) return $('#seatNew').focus();
    let p=S.players.find(x=>x.name.toLowerCase()===name.toLowerCase()); let pid=p&&p.id;
    if(!pid){ pid=newId('p'); if(!await save('players',pid,{name,active:true,createdAt:nowISO()})) return; }
    if(seated(n).some(r=>r.playerId===pid)) return toast('Ya está en la mesa.');
    await patchNight(n,{results:[...seated(n),{playerId:pid,rebuys:0,addons:0,kills:0,prize:0,paid:true,out:false,joinedAt:nowISO()}]},name+' se sentó en la mesa'); },
  liveAddon:async ds=>{ const n=S.nights.find(x=>x.id===ds.night); const res=seated(n).map(r=>r.playerId===ds.pid?{...r,addons:num(r.addons)+1}:r); await patchNight(n,{results:res},'Add-on para '+pname(ds.pid)); },
  rsvp:ds=>saveActions({rsvp:{...myActions().rsvp,[ds.night]:ds.v}}).then(ok=>ok&&toast(ds.v==='voy'?'¡Te esperamos!':ds.v==='tarde'?'Te marcamos como "en camino".':'Gracias por avisar.')),
  dealSheet:ds=>dealSheet(ds.night),
  dealFill:ds=>{ const ins=[...document.querySelectorAll('.deal-in')]; const n=S.nights.find(x=>x.status==='live'&&alive(x).length===3); if(!n) return; const pot=dealPot(n);
    if(ds.mode==='equal'){ const each=Math.floor(pot/ins.length); ins.forEach((i,k)=>i.value=k===0?pot-each*(ins.length-1):each); }
    else { const pct=(S.config.payout||[50,30,20]).slice(0,3); const tot=pct.reduce((a,b)=>a+num(b),0)||100; const vals=pct.map(p=>Math.floor(pot*num(p)/tot)); vals[0]+=pot-vals.reduce((a,b)=>a+b,0); ins.forEach((i,k)=>i.value=vals[k]||0); }
    dealSum(n.id); },
  sendDeal:async ds=>{ const n=S.nights.find(x=>x.id===ds.night); if(!n) return; const pot=dealPot(n); const amounts={};
    document.querySelectorAll('.deal-in').forEach(i=>amounts[i.dataset.deal]=num(i.value)); const sum=Object.values(amounts).reduce((a,b)=>a+b,0);
    if(Object.values(amounts).some(v=>v<0)) return $('#dealErr').textContent='Los montos no pueden ser negativos.';
    if(Math.abs(sum-pot)>0.5) return $('#dealErr').textContent=`La suma (${money(sum)}) debe ser igual al bote a repartir (${money(pot)}).`;
    const me=myPlayer();
    if(S.role==='admin' && !alive(n).some(r=>r.playerId===me)){ if(await patchNight(n,{deal:{key:'admin:'+newId('d'),amounts,total:pot,approvedAt:nowISO()}},'Trato registrado')) nightDetail(n.id); return; }
    const ok=await saveActions({deals:[...myActions().deals,{id:newId('d'),night:n.id,amounts,total:pot,at:nowISO()}]}); if(ok){ toast('Propuesta enviada. Los otros dos tienen que aceptarla.'); nightDetail(n.id); } },
  voteDeal:ds=>saveActions({votes:{...myActions().votes,[ds.key]:ds.v}}).then(ok=>{ if(ok){ S.promptKey=null; closeModal(); toast(ds.v==='si'?'Aceptaste el trato.':'Rechazaste el trato. Pueden proponer otro.'); } }),
  approveDeal:async ds=>{ const n=S.nights.find(x=>x.id===ds.night); const d=n&&dealList(n).find(x=>x.key===ds.key); if(!d) return;
    if(dealStatus(n,d)!=='accepted' && !confirm('No todos lo han aceptado. ¿Aprobarlo de todos modos?')) return;
    const pot=dealPot(n); if(Math.abs(pot-num(d.total))>0.5 && !confirm(`El bote cambió desde la propuesta (${money(d.total)} → ${money(pot)}). ¿Aprobar con los montos propuestos?`)) return;
    await patchNight(n,{deal:{key:d.key,amounts:d.amounts,total:num(d.total),approvedAt:nowISO()}},'Trato cerrado. Siguen jugando por los puntos.'); },
  denyDeal:async ds=>{ const n=S.nights.find(x=>x.id===ds.night); if(n) await patchNight(n,{dealRejected:[...(n.dealRejected||[]),ds.key]},'Trato rechazado'); },
  closeLive:ds=>{ const n=S.nights.find(x=>x.id===ds.id); if(!n) return; const al=alive(n).length;
    if(al>1 && !confirm(`Todavía hay ${al} jugadores en pie. ¿Cerrar de todos modos? Tendrás que acomodar sus lugares a mano.`)) return;
    if(pendingClaims(n).length && !confirm(`Hay ${pendingClaims(n).length} eliminaciones sin aprobar; no se contarán. ¿Continuar?`)) return;
    startDraft(n,{closing:true}); },
  startLive:ds=>{ const n=S.nights.find(x=>x.id===ds.id); if(n) startDraft(n,{toLive:true}); },
  saveScheduled:()=>saveNight('scheduled'),
  shareSummary:ds=>shareSummary(ds.id),
  downloadSummary:async()=>{ const b=await summaryBlob(); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=S.summaryName; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); },
  shareSummaryNow:async()=>{ try{ const b=await summaryBlob(); const f=new File([b],S.summaryName,{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:S.config.leagueName}); } else { await A.downloadSummary(); toast('Tu navegador no comparte directo; se descargó la imagen para que la mandes por WhatsApp.'); } }
    catch(e){ if(e&&e.name!=='AbortError') toast('No se pudo compartir. Usa "Descargar imagen".'); } },
});
