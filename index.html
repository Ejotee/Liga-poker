modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
$('#seasonSel').addEventListener('change',e=>{ S.season=e.target.value; render(); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'){ if(e.target.id==='reqName') A.sendRequest(); if(e.target.id==='newPlayer') A.addPlayer(); if(e.target.id==='seasonName') A.addSeason(); } });

document.addEventListener('input',e=>{ const t=e.target; if(t.dataset.pf && S.draftProfile){ S.draftProfile[t.dataset.pf]=t.value; } });
async function shrinkPhoto(file){
  const url=URL.createObjectURL(file);
  try{ const img=new Image(); await new Promise((ok,ko)=>{ img.onload=ok; img.onerror=ko; img.src=url; });
    const size=320, c=document.createElement('canvas'); c.width=c.height=size; const side=Math.min(img.naturalWidth,img.naturalHeight);
    const g=c.getContext('2d'); g.fillStyle='#000'; g.fillRect(0,0,size,size);
    g.drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,size,size);
    let q=.85, out=c.toDataURL('image/jpeg',q); while(out.length>150000 && q>.35){ q-=.1; out=c.toDataURL('image/jpeg',q); }
    return out;
  } finally { URL.revokeObjectURL(url); }
}
document.addEventListener('change',async e=>{ const t=e.target; if(t.id!=='photoInput' || !S.draftProfile) return; const f=t.files&&t.files[0]; if(!f) return;
  if(f.type && !/^image\//.test(f.type)) return toast('Elige una imagen.');
  try{ const data=await shrinkPhoto(f); if(!safePhoto(data)) return toast('No se pudo procesar la foto. Prueba con otra.'); S.draftProfile.photo=data; render(); toast('Foto lista. No olvides guardar tu perfil.'); }
  catch(_){ toast('No se pudo leer la foto. Prueba con otra en formato JPG o PNG.'); } });

/* form inputs (night draft) */
$('#modalBody').addEventListener('input',e=>{ const d=S.draft; if(!d) return; const t=e.target;
  if(t.dataset.g){ d[t.dataset.g] = ['buyIn','rebuy','addOn','seasonFee','fundPct','jornada'].includes(t.dataset.g) ? num(t.value) : t.value; updateSummary(); }
  else if(t.dataset.f && t.dataset.f!=='paid'){ const r=d.map[t.dataset.id]; if(r){ r[t.dataset.f]=t.value===''?'':num(t.value); updateSummary(); } } });
$('#modalBody').addEventListener('change',e=>{ const d=S.draft; if(!d) return; const t=e.target;
  if(t.dataset.pl){ const id=t.dataset.pl; if(t.checked){ d.map[id]={playerId:id,position:Object.keys(d.map).length+1,kills:0,rebuys:0,addons:0,prize:0,paid:true}; }
    else { const removed=num(d.map[id].position); delete d.map[id]; d.knockouts=(d.knockouts||[]).filter(k=>k.by!==id&&k.victim!==id); Object.values(d.map).forEach(r=>{ if(num(r.position)>removed) r.position=num(r.position)-1; }); }
    nightForm(); const again=document.querySelector(`[data-pl="${CSS.escape(id)}"]`); if(again) again.focus(); }
  else if(t.dataset.f==='paid'){ const r=d.map[t.dataset.id]; if(r) r.paid=t.checked; } });

/* ---------- boot ---------- */
function pickSeason(){
  if(S.season && (S.season==='all' || S.seasons.some(s=>s.id===S.season))) return;
  if(S.config.activeSeason && S.seasons.some(s=>s.id===S.config.activeSeason)) S.season=S.config.activeSeason;
  else if(S.seasons.length) S.season=[...S.seasons].sort((a,b)=>(b.start||'').localeCompare(a.start||''))[0].id;
  else S.season='all';
}
function makeDb(){
  const wrapQ=s=>({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))});
  return {
    collection:c=>({ doc:id=>({ set:d=>setDoc(doc(fsdb,c,id),d), delete:()=>deleteDoc(doc(fsdb,c,id)) }),
      onSnapshot:(next,err)=>onSnapshot(collection(fsdb,c),s=>next(wrapQ(s)),err) }),
    doc:path=>{ const [c,id]=path.split('/'); return { set:d=>setDoc(doc(fsdb,c,id),d),
      onSnapshot:(next,err)=>onSnapshot(doc(fsdb,c,id),s=>next({exists:s.exists(),data:()=>s.data()}),err) }; }
  };
}
function stopAll(){ unsubs.forEach(u=>{ try{u();}catch(_){} }); unsubs=[]; }
async function handleUser(user){
  stopAll(); if(modal.open) closeModal(); S.loaded={config:false,seasons:false,players:false,nights:false,profiles:false,claims:false};
  if(!user){ S.mode='login'; S.uid=null; S.role='viewer'; render(); return; }
  const cfg=window.LIGA_CONFIG||{};
  S.uid=user.uid; S.email=(user.email||'').toLowerCase();
  S.isOwnerUser = !!cfg.ownerEmail && S.email===String(cfg.ownerEmail).trim().toLowerCase() && user.emailVerified;
  let member=S.isOwnerUser, admin=S.isOwnerUser;
  if(!member){ try{ member=(await getDoc(doc(fsdb,'members',user.uid))).exists(); }catch(_){ member=false; } }
  if(member && !admin){ try{ admin=(await getDoc(doc(fsdb,'admins',user.uid))).exists(); }catch(_){} }
  if(!member){
    S.displayName=user.displayName||''; S.myRequest=null; S.editReq=false; S.mode='pending'; render();
    unsubs.push(onSnapshot(doc(fsdb,'requests',user.uid),s=>{ S.myRequest=s.exists()?s.data():null; if(S.mode==='pending'&&!document.activeElement?.id?.startsWith('reqName')) render(); },()=>{}));
    unsubs.push(onSnapshot(doc(fsdb,'members',user.uid),s=>{ if(s.exists()) handleUser(auth.currentUser); },()=>{}));
    return;
  }
  S.role=admin?'admin':'player'; S.canWrite=admin; S.mode='live'; db=makeDb(); render();
  const err=e=>{ console.warn(e); };
  const rows=snap=>snap.docs.map(d=>({...d.data(),id:d.id}));
  const mapRows=snap=>{ const o={}; snap.docs.forEach(d=>o[d.id]=d.data()); return o; };
  unsubs.push(db.doc('league/config').onSnapshot(s=>{ S.config={...DEFAULT_CONFIG,...(s.exists?s.data():{})}; S.loaded.config=true; pickSeason(); render(); }, err));
  unsubs.push(db.collection('seasons').onSnapshot(s=>{ S.seasons=rows(s); S.loaded.seasons=true; pickSeason(); render(); }, err));
  unsubs.push(db.collection('players').onSnapshot(s=>{ S.players=rows(s); S.loaded.players=true; render(); }, err));
  unsubs.push(db.collection('nights').onSnapshot(s=>{ S.nights=rows(s); S.loaded.nights=true; render(); }, err));
  unsubs.push(db.collection('profiles').onSnapshot(s=>{ S.profiles=mapRows(s); S.loaded.profiles=true; render(); }, err));
  unsubs.push(db.collection('claims').onSnapshot(s=>{ S.claims=mapRows(s); S.loaded.claims=true; render(); }, err));
  unsubs.push(db.collection('admins').onSnapshot(s=>{ S.admins=mapRows(s); render(); }, err));
  if(admin){
    unsubs.push(db.collection('members').onSnapshot(s=>{ S.members=mapRows(s); Object.entries(S.members).forEach(([k,v])=>S.userNames[k]=v.name||v.email||''); render(); }, err));
    unsubs.push(db.collection('requests').onSnapshot(s=>{ S.requests=mapRows(s); render(); }, err));
  }
}
function boot(){
  const cfg=window.LIGA_CONFIG||{};
  if(!cfg.firebase || !cfg.firebase.apiKey || String(cfg.firebase.apiKey).startsWith('PEGA')){ S.mode='setup'; render(); return; }
  const app=initializeApp(cfg.firebase); auth=getAuth(app); fsdb=getFirestore(app);
  if(cfg.leagueName){ DEFAULT_CONFIG.leagueName=cfg.leagueName; S.config.leagueName=cfg.leagueName; }
  onAuthStateChanged(auth,u=>{ handleUser(u); });
}
render(); boot();
</script>
